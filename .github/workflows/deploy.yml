name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Require the production photo connection
        if: github.event_name != 'pull_request'
        env:
          PHOTO_URL: ${{ vars.VITE_SUPABASE_URL }}
          PHOTO_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$PHOTO_URL" && test -n "$PHOTO_KEY" || {
            echo 'Supabase public build variables are missing; refusing to deploy a disconnected photo manager.'
            exit 1
          }
      - name: Build the public pages and admin
        run: npm run build
        env:
          BASE_PATH: ./
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Pricing, enquiries, delayed data, and admin drafts
        run: npm test
      - name: Identify the verified release
        run: |
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("dist/release.json", JSON.stringify({commit: process.env.GITHUB_SHA}) + "\n")'
      - name: Start headless Chrome
        run: |
          google-chrome --headless=new --remote-debugging-port=9222 \
            --hide-scrollbars --disable-gpu --no-first-run \
            --no-sandbox --disable-dev-shm-usage \
            --user-data-dir=/tmp/ci-chrome about:blank &
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:9222/json/version
      - name: Serve the exact build that will be deployed
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.5
          done
          curl -sf -o /dev/null http://127.0.0.1:4173/
      - name: Public layouts and navigation at seven widths
        run: npm run verify -- http://127.0.0.1:4173
        env:
          OFFLINE_GALLERY: 1
          REVIEW_WIDTHS: 320,390,430,768,1024,1440,1920
      - name: Real admin UI, image uploads, publishing retries, and no-JavaScript pages
        run: npm run verify:admin
      - name: Save public and admin screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-screenshots
          path: |
            shots/verify/*.png
            shots/admin-verify/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Save the verified build for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Verify the release on the live domain
        run: node tools/verify-live.mjs
        env:
          LIVE_URL: https://shutterhausvisuals.co.za/
          EXPECTED_SHA: ${{ github.sha }}
